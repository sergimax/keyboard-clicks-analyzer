<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keyboard Heatmap (local)</title>
  <style>
    :root {
      --bg: #12151a;
      --panel: #1a1f27;
      --text: #e8edf5;
      --muted: #8b95a8;
      --key-bg: #252b36;
      --key-border: #343c4a;
      --cold: #1f6f5b;
      --hot: #e85d04;
      --gap: 6px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1e3a34 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #3a2418 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      padding: 28px 20px 48px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .sub {
      color: var(--muted);
      margin-bottom: 22px;
      font-size: 0.95rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 24px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 0.9rem;
      align-items: center;
      justify-content: space-between;
    }
    .meta-main {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 24px;
      align-items: center;
    }
    .meta strong { color: var(--text); font-weight: 600; }
    .live-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1f6f5b;
      color: #e8edf5;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .board-wrap {
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(24, minmax(36px, 42px));
      grid-template-rows: repeat(6, 44px);
      gap: var(--gap);
      width: max-content;
      min-width: 320px;
      min-height: 300px;
      background: #141820;
      border: 1px solid #2a3140;
      border-radius: 14px;
      padding: 14px;
    }
    .key {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--key-border);
      background: var(--key-bg);
      color: var(--text);
      font-size: 0.72rem;
      line-height: 1.1;
      text-align: center;
      padding: 2px 3px;
      user-select: none;
      min-width: 0;
    }
    .key .lbl { font-weight: 600; word-break: break-all; }
    .key .cnt {
      font-size: 0.62rem;
      color: #c5cddb;
      margin-top: 2px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr minmax(240px, 300px);
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
    }
    .side {
      background: var(--panel);
      border: 1px solid #2a3140;
      border-radius: 14px;
      padding: 14px 16px;
    }
    .side h2 {
      margin: 0 0 12px;
      font-size: 1rem;
    }
    .rank-block {
      margin: 0 0 22px;
      padding: 0 0 18px;
      border-bottom: 1px solid #2a3140;
    }
    .rank-block:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .rank-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .rank-summary strong { color: var(--text); font-weight: 600; }
    ol {
      margin: 0;
      padding-left: 1.2rem;
    }
    li {
      margin: 0.35rem 0;
      font-size: 0.9rem;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .swatch {
      width: 140px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cold), #f4a261, var(--hot));
      border: 1px solid #2a3140;
    }
    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
      max-width: 70ch;
    }
    .btn-reset {
      appearance: none;
      border: 1px solid #5a4030;
      background: #2a1f18;
      color: #f4a261;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-reset:hover {
      background: #3a2a20;
      border-color: #e85d04;
      color: #ffd4a8;
    }
    .btn-reset:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .side-heading {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      margin: 0 0 12px;
    }
    .side-heading h2 {
      margin: 0;
      font-size: 1rem;
    }
    .btn-copy {
      appearance: none;
      border: 1px solid #1f6f5b;
      background: #1a2e28;
      color: #b8e0d4;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .btn-copy:hover {
      background: #234038;
      border-color: #2f9e82;
      color: #e8edf5;
    }
    .btn-copy:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .side-empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .view-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      margin: 0 0 18px;
    }
    .toggle-numpad {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }
    .toggle-numpad input {
      width: 1rem;
      height: 1rem;
      accent-color: #1f6f5b;
      cursor: pointer;
    }
    body.hide-numpad .key-numpad {
      display: none;
    }
    body.hide-numpad .board {
      grid-template-columns: repeat(19, minmax(36px, 42px));
    }
  </style>
  __LIVE_HEAD__
  __PAGE_SCRIPT__
</head>
<body>
  <h1>Keyboard Heatmap</h1>
  <p class="sub">Local physical-key presses · no network · labels use US QWERTY positions</p>
  <div class="view-controls">
    <label class="toggle-numpad">
      <input type="checkbox" id="toggle-numpad" checked />
      Show numpad
    </label>
  </div>
  <div id="live-root">__BODY__</div>
</body>
</html>
